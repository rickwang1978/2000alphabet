        // --- 狀態管理變數 ---
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let streak = 0;
        let selectedCount = 5;
        let selectedUnit = 'all';
        let wrongAnswers = [];
        let isAnswered = false;
        let autoNextTimer = null;

        // SpeechSynthesis 發音元件
        const synth = window.speechSynthesis;

        const setupScreen = document.getElementById('setup-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');

        const unitSelect = document.getElementById('unit-select');
        const startBtn = document.getElementById('start-btn');

        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const scoreText = document.getElementById('score-text');
        const streakTag = document.getElementById('streak-tag');
        const streakCount = document.getElementById('streak-count');
        const badgeMode = document.getElementById('badge-mode');

        const wordTitle = document.getElementById('word-title');
        const wordCategory = document.getElementById('word-category');
        const speakWordBtn = document.getElementById('speak-word-btn');
        const optionsContainer = document.getElementById('options-container');

        const finalScore = document.getElementById('final-score');
        const finalAccuracy = document.getElementById('final-accuracy');
        const mistakesContainer = document.getElementById('mistakes-container');
        const mistakesList = document.getElementById('mistakes-list');
        const restartBtn = document.getElementById('restart-btn');

        // 初始化與事件綁定
        window.addEventListener('DOMContentLoaded', () => {
            initCountButtons();
            startBtn.addEventListener('click', startQuiz);
            restartBtn.addEventListener('click', resetQuiz);

            speakWordBtn.addEventListener('click', () => {
                const current = currentQuestions[currentIndex];
                if (current) playSpeech(current.word, speakWordBtn);
            });
        });

        // 選擇題數按鈕事件
        function initCountButtons() {
            countButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    countButtons.forEach(b => {
                        b.classList.remove('active', 'bg-sky-500', 'text-white', 'shadow-md', 'shadow-sky-200');
                        b.classList.add('bg-white', 'text-slate-600', 'border-sky-200');
                    });
                    btn.classList.add('active', 'bg-sky-500', 'text-white', 'shadow-md', 'shadow-sky-200');
                    btn.classList.remove('bg-white', 'text-slate-600');
                    selectedCount = parseInt(btn.dataset.count);
                });
            });
        }

        // 開始測驗邏輯
        function startQuiz() {
            if (autoNextTimer) {
                clearTimeout(autoNextTimer);
                autoNextTimer = null;
            }

            selectedUnit = unitSelect.value;
            let filtered = vocabularyData;

            if (selectedUnit === 'all') {
                filtered = vocabularyData;
                if (badgeMode) badgeMode.innerHTML = `<i class="fa-solid fa-book-open mr-1"></i> Unit 1 ~ 15 全題庫`;
            } else if (selectedUnit.includes('-')) {
                // 處理 5 個單元隨機混合 (例如 "1-5", "6-10", "11-15")
                const [start, end] = selectedUnit.split('-').map(Number);
                filtered = vocabularyData.filter(item => item.unit >= start && item.unit <= end);
                if (badgeMode) badgeMode.innerHTML = `<i class="fa-solid fa-book-open mr-1"></i> Unit ${start} ~ ${end}`;
            } else {
                // 個別單元測驗
                const unitNum = parseInt(selectedUnit);
                filtered = vocabularyData.filter(item => item.unit === unitNum);
                if (badgeMode) badgeMode.innerHTML = `<i class="fa-solid fa-book-open mr-1"></i> Unit ${unitNum}`;
            }

            if (filtered.length < 4) {
                // 如果單元題目較少，混合其他題目補充
                filtered = [...filtered, ...vocabularyData.filter(i => !filtered.includes(i))];
            }

            // 洗牌並取出指定的題數
            const shuffled = shuffleArray([...filtered]);
            currentQuestions = shuffled.slice(0, Math.min(selectedCount, shuffled.length));

            currentIndex = 0;
            score = 0;
            streak = 0;
            wrongAnswers = [];

            setupScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            renderQuestion();
        }

        // 渲染目前題目
        function renderQuestion() {
            if (autoNextTimer) {
                clearTimeout(autoNextTimer);
                autoNextTimer = null;
            }

            isAnswered = false;
            const item = currentQuestions[currentIndex];

            // 更新標題與資訊
            progressText.innerText = `第 ${currentIndex + 1} / ${currentQuestions.length} 題`;
            progressBar.style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;
            scoreText.innerHTML = `<i class="fa-solid fa-star text-amber-400"></i> 得分: ${score}`;

            if (streak > 1) {
                streakTag.classList.remove('hidden');
                streakCount.innerText = streak;
            } else {
                streakTag.classList.add('hidden');
            }

            wordTitle.innerText = item.word;
            wordCategory.innerText = `Unit ${item.unit} • ${item.category}`;

            // 自動朗讀單字
            setTimeout(() => {
                playSpeech(item.word, speakWordBtn);
            }, 300);

            // 生成 4 個選項 (1 正確 + 3 誘答)
            const distractors = getRandomDistractors(item, 3);
            const options = shuffleArray([item, ...distractors]);

            optionsContainer.innerHTML = '';
            options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left bg-white border-2 border-sky-100 hover:border-sky-300 rounded-2xl p-4 font-bold text-slate-700 shadow-sm flex items-center justify-between group`;
                btn.innerHTML = `
                    <span class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-sm font-bold border border-sky-200 group-hover:bg-sky-500 group-hover:text-white transition">
                            ${String.fromCharCode(65 + idx)}
                        </span>
                        <span class="text-base">${opt.meaning}</span>
                    </span>
                    <i class="fa-regular fa-circle text-sky-200 text-lg group-hover:text-sky-400"></i>
                `;
                btn.addEventListener('click', () => handleAnswer(opt, item, btn));
                optionsContainer.appendChild(btn);
            });
        }

        // 處理作答選擇
        function handleAnswer(selected, correct, selectedBtn) {
            if (isAnswered) return;
            isAnswered = true;

            const allButtons = optionsContainer.querySelectorAll('button');
            allButtons.forEach(btn => btn.disabled = true);

            const isCorrect = selected.meaning === correct.meaning;

            if (isCorrect) {
                // 答對處理：高亮綠色，停留 1 秒自動跳下一題
                score += 10;
                streak++;
                selectedBtn.className = `option-btn w-full text-left bg-emerald-50 border-2 border-emerald-400 rounded-2xl p-4 font-bold text-emerald-800 shadow-sm flex items-center justify-between`;
                selectedBtn.querySelector('i').className = `fa-solid fa-circle-check text-emerald-500 text-xl`;

                autoNextTimer = setTimeout(() => {
                    nextQuestion();
                }, 1000);
            } else {
                // 答錯處理：標示錯誤紅色與正確答案，停留 2 秒自動跳下一題
                streak = 0;
                wrongAnswers.push(correct);

                selectedBtn.className = `option-btn w-full text-left bg-rose-50 border-2 border-rose-400 rounded-2xl p-4 font-bold text-rose-800 shadow-sm flex items-center justify-between`;
                selectedBtn.querySelector('i').className = `fa-solid fa-circle-xmark text-rose-500 text-xl`;

                // 標示正確選項
                allButtons.forEach(btn => {
                    if (btn.innerText.includes(correct.meaning)) {
                        btn.className = `option-btn w-full text-left bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-4 font-bold text-emerald-700 shadow-sm flex items-center justify-between`;
                        btn.querySelector('i').className = `fa-solid fa-circle-check text-emerald-500 text-xl`;
                    }
                });

                autoNextTimer = setTimeout(() => {
                    nextQuestion();
                }, 2000);
            }
        }

        // 下一題或進入結算
        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        // 結算頁面展示
        function showResults() {
            if (autoNextTimer) {
                clearTimeout(autoNextTimer);
                autoNextTimer = null;
            }

            progressBar.style.width = "100%";
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const total = currentQuestions.length;
            const correctCount = total - wrongAnswers.length;
            const accuracyPercent = Math.round((correctCount / total) * 100);

            finalScore.innerText = `${accuracyPercent}%`;
            finalAccuracy.innerText = `${correctCount} / ${total}`;

            // 觸發多層次「純藍色系」灑花
            triggerBlueConfetti();

            // 播放歡呼音效
            playCheerSound();

            // 處理錯題檢討清單
            if (wrongAnswers.length > 0) {
                mistakesContainer.classList.remove('hidden');
                mistakesList.innerHTML = '';
                wrongAnswers.forEach(item => {
                    const row = document.createElement('div');
                    row.className = `bg-white border border-sky-100 rounded-xl p-3 flex items-center justify-between text-sm shadow-sm`;
                    row.innerHTML = `
                        <div>
                            <span class="font-bold text-slate-800">${item.word}</span>
                            <span class="text-xs text-sky-500 ml-2 font-medium">Unit ${item.unit}</span>
                            <p class="text-xs text-slate-500 mt-0.5">${item.meaning}</p>
                        </div>
                        <button class="review-speak-btn text-sky-500 hover:text-sky-700 bg-sky-50 hover:bg-sky-100 p-2 rounded-lg transition" title="聽發音">
                            <i class="fa-solid fa-volume-low"></i>
                        </button>
                    `;
                    row.querySelector('.review-speak-btn').addEventListener('click', () => playSpeech(item.word));
                    mistakesList.appendChild(row);
                });
            } else {
                mistakesContainer.classList.add('hidden');
            }
        }

        // 重置測驗
        function resetQuiz() {
            if (autoNextTimer) {
                clearTimeout(autoNextTimer);
                autoNextTimer = null;
            }
            resultScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        }

        // --- 純藍色系 Confetti 灑花效果 (小桃限定調色) ---
        function triggerBlueConfetti() {
            if (typeof confetti !== 'function') return;

            // 純藍色調組合: 極淺雪藍, 天空藍, 寶藍, 皇家純藍, 經典純藍, 靛藍
            const bluePalette = ['#e0f2fe', '#7dd3fc', '#38bdf8', '#0284c7', '#0052cc', '#0033ff', '#0000d1'];

            // 第一波雙側發射
            confetti({
                particleCount: 60,
                spread: 70,
                origin: { y: 0.6, x: 0.2 },
                colors: bluePalette
            });
            confetti({
                particleCount: 60,
                spread: 70,
                origin: { y: 0.6, x: 0.8 },
                colors: bluePalette
            });

            // 第二波中央高空漫天降落
            setTimeout(() => {
                confetti({
                    particleCount: 80,
                    angle: 90,
                    spread: 100,
                    origin: { y: 0.4 },
                    colors: bluePalette,
                    scalar: 1.2
                });
            }, 250);
        }

        // --- Web Audio API 歡呼與勝利音效合成 ---
        function playCheerSound() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                // 1. 勝利短音階 (Fanfare Melody: C5 -> E5 -> G5 -> C6)
                const notes = [
                    { f: 523.25, start: 0, duration: 0.15 },    // C5
                    { f: 659.25, start: 0.15, duration: 0.15 },  // E5
                    { f: 783.99, start: 0.3, duration: 0.15 },   // G5
                    { f: 1046.50, start: 0.45, duration: 0.65 }  // C6
                ];

                notes.forEach(note => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = note.f;

                    gain.gain.setValueAtTime(0, ctx.currentTime + note.start);
                    gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + note.start + 0.03);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + note.start + note.duration);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(ctx.currentTime + note.start);
                    osc.stop(ctx.currentTime + note.start + note.duration);
                });

                // 2. 人群歡呼與掌聲模擬聲 (Filtered Noise)
                const bufferSize = ctx.sampleRate * 2.0; // 2 秒音訊
                const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1; // 白雜訊
                }

                const noise = ctx.createBufferSource();
                noise.buffer = buffer;

                // 帶通濾波器：調製成類似歡呼掌聲的頻率
                const filter = ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1400;
                filter.Q.value = 1.2;

                const noiseGain = ctx.createGain();
                noiseGain.gain.setValueAtTime(0, ctx.currentTime + 0.2);
                noiseGain.gain.linearRampToValueAtTime(0.22, ctx.currentTime + 0.5);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 2.0);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(ctx.destination);

                noise.start(ctx.currentTime + 0.2);
                noise.stop(ctx.currentTime + 2.0);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        // 英文語音朗讀函式 (Web Speech API)
        function playSpeech(text, buttonEl = null) {
            if (!('speechSynthesis' in window)) return;

            synth.cancel(); // 停止先前的發音
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9; // 稍微放慢語速

            if (buttonEl) {
                buttonEl.classList.add('speaking-active');
                utterance.onend = () => buttonEl.classList.remove('speaking-active');
                utterance.onerror = () => buttonEl.classList.remove('speaking-active');
            }

            synth.speak(utterance);
        }

        // 輔助工具: 取得隨機誘答選項
        function getRandomDistractors(correctItem, count) {
            const pool = vocabularyData.filter(item => item.meaning !== correctItem.meaning);
            return shuffleArray(pool).slice(0, count);
        }

        // 輔助工具: 洗牌演算法 (Fisher-Yates)
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
    </script>
