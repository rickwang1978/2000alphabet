            { unit: 7, word: "decide", meaning: "決定", category: "動詞", sentenceEn: "I can't decide what to eat.", sentenceZh: "我無法決定要吃什麼。" },
            { unit: 7, word: "successful", meaning: "成功的", category: "形容詞", sentenceEn: "He is a successful businessman.", sentenceZh: "他是一位成功的商人。" },
            { unit: 7, word: "give up", meaning: "放棄", category: "片語", sentenceEn: "Never give up on your dreams.", sentenceZh: "永遠不要放棄你的夢想。" },
            { unit: 7, word: "be good at", meaning: "擅長於", category: "片語", sentenceEn: "She is good at playing basketball.", sentenceZh: "她很擅長打籃球。" },

            // Unit 8
            { unit: 8, word: "hospital", meaning: "醫院", category: "名詞", sentenceEn: "The hospital is near the station.", sentenceZh: "醫院在車站附近。" },
            { unit: 8, word: "glasses", meaning: "眼鏡", category: "名詞", sentenceEn: "He wears a pair of black glasses.", sentenceZh: "他戴著一副黑色眼鏡。" },
            { unit: 8, word: "expensive", meaning: "昂貴的", category: "形容詞", sentenceEn: "This car is too expensive.", sentenceZh: "這輛車太貴了。" },
            { unit: 8, word: "turn left", meaning: "向左轉", category: "片語", sentenceEn: "Turn left at the next corner.", sentenceZh: "在下一個轉角向左轉。" },
            { unit: 8, word: "take off", meaning: "脫下；起飛", category: "片語", sentenceEn: "Please take off your shoes.", sentenceZh: "請脫下你的鞋子。" },

            // Unit 9
            { unit: 9, word: "chopsticks", meaning: "筷子", category: "名詞", sentenceEn: "We eat noodles with chopsticks.", sentenceZh: "我們用筷子吃麵。" },
            { unit: 9, word: "steak", meaning: "牛排", category: "名詞", sentenceEn: "I ordered a medium steak.", sentenceZh: "我點了一份五分熟的牛排。" },
            { unit: 9, word: "delicious", meaning: "美味的", category: "形容詞", sentenceEn: "This beef soup is delicious.", sentenceZh: "這道牛肉湯非常美味。" },
            { unit: 9, word: "stay away from", meaning: "遠離", category: "片語", sentenceEn: "Stay away from dangerous places.", sentenceZh: "遠離危險的地方。" },

            // Unit 10
            { unit: 10, word: "earthquake", meaning: "地震", category: "名詞", sentenceEn: "An earthquake hit Taiwan last night.", sentenceZh: "昨晚台灣發生了地震。" },
            { unit: 10, word: "rainbow", meaning: "彩虹", category: "名詞", sentenceEn: "Look at the colorful rainbow!", sentenceZh: "看那道五彩繽紛的彩虹！" },
            { unit: 10, word: "prepare", meaning: "準備", category: "動詞", sentenceEn: "Mom is preparing lunch for us.", sentenceZh: "媽媽正在為我們準備午餐。" },
            { unit: 10, word: "take a break", meaning: "休息一下", category: "片語", sentenceEn: "Let's take a break for ten minutes.", sentenceZh: "讓我們休息十分鐘吧。" },

            // Unit 11
            { unit: 11, word: "headache", meaning: "頭痛", category: "名詞", sentenceEn: "I have a bad headache today.", sentenceZh: "我今天頭痛得很厲害。" },
            { unit: 11, word: "medicine", meaning: "藥", category: "名詞", sentenceEn: "Take this medicine after meals.", sentenceZh: "飯後服用這個藥。" },
            { unit: 11, word: "comfortable", meaning: "舒適的", category: "形容詞", sentenceEn: "This sofa is very comfortable.", sentenceZh: "這張沙發非常舒適。" },
            { unit: 11, word: "under the weather", meaning: "身體不舒服", category: "片語", sentenceEn: "I'm feeling under the weather today.", sentenceZh: "我今天覺得身體有點不舒服。" },

            // Unit 12
            { unit: 12, word: "gym", meaning: "健身房", category: "名詞", sentenceEn: "He exercises at the gym every day.", sentenceZh: "他每天在健身房運動。" },
            { unit: 12, word: "habit", meaning: "習慣", category: "名詞", sentenceEn: "Reading is a good habit.", sentenceZh: "閱讀是一個好習慣。" },
            { unit: 12, word: "proud", meaning: "自豪的", category: "形容詞", sentenceEn: "My parents are proud of me.", sentenceZh: "我的父母為我感到自豪。" },
            { unit: 12, word: "stay in shape", meaning: "保持健康", category: "片語", sentenceEn: "Exercise helps you stay in shape.", sentenceZh: "運動幫助你保持健康體態。" },

            // Unit 13
            { unit: 13, word: "refrigerator", meaning: "冰箱", category: "名詞", sentenceEn: "Put the milk in the refrigerator.", sentenceZh: "把牛奶放進冰箱。" },
            { unit: 13, word: "badminton", meaning: "羽毛球", category: "名詞", sentenceEn: "They enjoy playing badminton.", sentenceZh: "他們喜歡打羽毛球。" },
            { unit: 13, word: "collect", meaning: "收集", category: "動詞", sentenceEn: "He likes to collect stamps.", sentenceZh: "他喜歡收集郵票。" },
            { unit: 13, word: "show up", meaning: "出現", category: "片語", sentenceEn: "He didn't show up at the party.", sentenceZh: "他沒有出現在派對上。" },

            // Unit 14
            { unit: 14, word: "dictionary", meaning: "字典", category: "名詞", sentenceEn: "You can look up words in the dictionary.", sentenceZh: "你可以在字典裡查單字。" },
            { unit: 14, word: "neighbor", meaning: "鄰居", category: "名詞", sentenceEn: "Our neighbor is friendly.", sentenceZh: "我們的鄰居很友善。" },
            { unit: 14, word: "polite", meaning: "有禮貌的", category: "形容詞", sentenceEn: "It's important to be polite.", sentenceZh: "有禮貌是非常重要的。" },
            { unit: 14, word: "hang out", meaning: "經常出入；逛街", category: "片語", sentenceEn: "We like to hang out at the mall.", sentenceZh: "我們喜歡在購物中心逛街。" },

            // Unit 15
            { unit: 15, word: "language", meaning: "語言", category: "名詞", sentenceEn: "English is a global language.", sentenceZh: "英語是一門全球語言。" },
            { unit: 15, word: "cheer up", meaning: "振作起來", category: "片語", sentenceEn: "Cheer up! Things will get better.", sentenceZh: "振作起來！事情會好轉的。" },
            { unit: 15, word: "Knowledge is power.", meaning: "知識就是力量。", category: "佳句", sentenceEn: "Remember that knowledge is power.", sentenceZh: "記住，知識就是力量。" }
        ];

        // --- 狀態管理變數 ---
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let streak = 0;
        let selectedCount = 10;
        let selectedUnit = 'all';
        let wrongAnswers = [];
        let isAnswered = false;

        // SpeechSynthesis 發音元件
        const synth = window.speechSynthesis;

        // DOM 元素引用
        const setupScreen = document.getElementById('setup-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const countButtons = document.querySelectorAll('.count-btn');
        const unitSelect = document.getElementById('unit-select');
        const startBtn = document.getElementById('start-btn');

        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const scoreText = document.getElementById('score-text');
        const streakTag = document.getElementById('streak-tag');
        const streakCount = document.getElementById('streak-count');
        const badgeMode = document.getElementById('badge-mode');

        const wordTitle = document.getElementById('word-title');
        const wordCategory = document.getElementById('word-category');
        const speakWordBtn = document.getElementById('speak-word-btn');
        const optionsContainer = document.getElementById('options-container');

        const feedbackCard = document.getElementById('feedback-card');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackMeaning = document.getElementById('feedback-meaning');
        const sentenceEn = document.getElementById('sentence-en');
        const sentenceZh = document.getElementById('sentence-zh');
        const speakSentenceBtn = document.getElementById('speak-sentence-btn');
        const nextBtn = document.getElementById('next-btn');

        const finalScore = document.getElementById('final-score');
        const finalAccuracy = document.getElementById('final-accuracy');
        const mistakesContainer = document.getElementById('mistakes-container');
        const mistakesList = document.getElementById('mistakes-list');
        const restartBtn = document.getElementById('restart-btn');

        // 初始化與事件綁定
        window.addEventListener('DOMContentLoaded', () => {
            initCountButtons();
            startBtn.addEventListener('click', startQuiz);
            nextBtn.addEventListener('click', nextQuestion);
            restartBtn.addEventListener('click', resetQuiz);

            speakWordBtn.addEventListener('click', () => {
                const current = currentQuestions[currentIndex];
                if (current) playSpeech(current.word, speakWordBtn);
            });

            speakSentenceBtn.addEventListener('click', () => {
                const current = currentQuestions[currentIndex];
                if (current) playSpeech(current.sentenceEn, speakSentenceBtn);
            });
        });

        // 選擇題數按鈕事件
        function initCountButtons() {
            countButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    countButtons.forEach(b => {
                        b.classList.remove('active', 'bg-sky-500', 'text-white', 'shadow-md', 'shadow-sky-200');
                        b.classList.add('bg-white', 'text-slate-600', 'border-sky-200');
                    });
                    btn.classList.add('active', 'bg-sky-500', 'text-white', 'shadow-md', 'shadow-sky-200');
                    btn.classList.remove('bg-white', 'text-slate-600');
                    selectedCount = parseInt(btn.dataset.count);
                });
            });
        }

        // 開始測驗邏輯
        function startQuiz() {
            selectedUnit = unitSelect.value;
            let filtered = vocabularyData;

            if (selectedUnit === 'all') {
                filtered = vocabularyData;
                if (badgeMode) badgeMode.innerHTML = `<i class="fa-solid fa-book-open mr-1"></i> Unit 1 ~ 15`;
            } else if (selectedUnit.includes('-')) {
                // 處理 5 個單元隨機混合 (例如 "1-5", "6-10", "11-15")
                const [start, end] = selectedUnit.split('-').map(Number);
                filtered = vocabularyData.filter(item => item.unit >= start && item.unit <= end);
                if (badgeMode) badgeMode.innerHTML = `<i class="fa-solid fa-book-open mr-1"></i> Unit ${start} ~ ${end}`;
            } else {
                // 個別單元測驗
                const unitNum = parseInt(selectedUnit);
                filtered = vocabularyData.filter(item => item.unit === unitNum);
                if (badgeMode) badgeMode.innerHTML = `<i class="fa-solid fa-book-open mr-1"></i> Unit ${unitNum}`;
            }

            if (filtered.length < 4) {
                // 如果單元題目較少，混合其他題目補充
                filtered = [...filtered, ...vocabularyData.filter(i => !filtered.includes(i))];
            }

            // 洗牌並取出指定的題數
            const shuffled = shuffleArray([...filtered]);
            currentQuestions = shuffled.slice(0, Math.min(selectedCount, shuffled.length));

            currentIndex = 0;
            score = 0;
            streak = 0;
            wrongAnswers = [];

            setupScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');

            renderQuestion();
        }

        // 渲染目前題目
        function renderQuestion() {
            isAnswered = false;
            const item = currentQuestions[currentIndex];

            // 更新標題與資訊
            progressText.innerText = `第 ${currentIndex + 1} / ${currentQuestions.length} 題`;
            progressBar.style.width = `${((currentIndex) / currentQuestions.length) * 100}%`;
            scoreText.innerHTML = `<i class="fa-solid fa-star text-amber-400"></i> 得分: ${score}`;

            if (streak > 1) {
                streakTag.classList.remove('hidden');
                streakCount.innerText = streak;
            } else {
                streakTag.classList.add('hidden');
            }

            wordTitle.innerText = item.word;
            wordCategory.innerText = `Unit ${item.unit} • ${item.category}`;

            // 自動朗讀單字
            setTimeout(() => {
                playSpeech(item.word, speakWordBtn);
            }, 300);

            // 生成 4 個選項 (1 正確 + 3 誘答)
            const distractors = getRandomDistractors(item, 3);
            const options = shuffleArray([item, ...distractors]);

            optionsContainer.innerHTML = '';
            options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `option-btn w-full text-left bg-white border-2 border-sky-100 hover:border-sky-300 rounded-2xl p-4 font-bold text-slate-700 shadow-sm flex items-center justify-between group`;
                btn.innerHTML = `
                    <span class="flex items-center gap-3">
                        <span class="w-8 h-8 rounded-xl bg-sky-50 text-sky-600 flex items-center justify-center text-sm font-bold border border-sky-200 group-hover:bg-sky-500 group-hover:text-white transition">
                            ${String.fromCharCode(65 + idx)}
                        </span>
                        <span class="text-base">${opt.meaning}</span>
                    </span>
                    <i class="fa-regular fa-circle text-sky-200 text-lg group-hover:text-sky-400"></i>
                `;
                btn.addEventListener('click', () => handleAnswer(opt, item, btn));
                optionsContainer.appendChild(btn);
            });

            // 隱藏反饋與下一題按鈕
            feedbackCard.classList.add('hidden');
            nextBtn.classList.add('hidden');
        }

        // 處理作答選擇
        function handleAnswer(selected, correct, selectedBtn) {
            if (isAnswered) return;
            isAnswered = true;

            const allButtons = optionsContainer.querySelectorAll('button');
            allButtons.forEach(btn => btn.disabled = true);

            const isCorrect = selected.meaning === correct.meaning;

            if (isCorrect) {
                // 答對處理
                score += 10;
                streak++;
                selectedBtn.className = `option-btn w-full text-left bg-emerald-50 border-2 border-emerald-400 rounded-2xl p-4 font-bold text-emerald-800 shadow-sm flex items-center justify-between`;
                selectedBtn.querySelector('i').className = `fa-solid fa-circle-check text-emerald-500 text-xl`;

                feedbackCard.className = `rounded-2xl p-4 sm:p-5 border-2 bg-emerald-50/80 border-emerald-200 text-slate-700 shadow-sm`;
                feedbackIcon.innerHTML = `<i class="fa-solid fa-face-smile text-emerald-500"></i>`;
                feedbackTitle.innerText = "答對了！非常棒！";
                feedbackTitle.className = "font-bold text-lg text-emerald-700";
            } else {
                // 答錯處理
                streak = 0;
                wrongAnswers.push(correct);

                selectedBtn.className = `option-btn w-full text-left bg-rose-50 border-2 border-rose-400 rounded-2xl p-4 font-bold text-rose-800 shadow-sm flex items-center justify-between`;
                selectedBtn.querySelector('i').className = `fa-solid fa-circle-xmark text-rose-500 text-xl`;

                // 標示正確選項
                allButtons.forEach(btn => {
                    if (btn.innerText.includes(correct.meaning)) {
                        btn.className = `option-btn w-full text-left bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-4 font-bold text-emerald-700 shadow-sm flex items-center justify-between`;
                        btn.querySelector('i').className = `fa-solid fa-circle-check text-emerald-500 text-xl`;
                    }
                });

                feedbackCard.className = `rounded-2xl p-4 sm:p-5 border-2 bg-rose-50/80 border-rose-200 text-slate-700 shadow-sm`;
                feedbackIcon.innerHTML = `<i class="fa-solid fa-circle-exclamation text-rose-500"></i>`;
                feedbackTitle.innerText = "可惜答錯了！正確意思如下：";
                feedbackTitle.className = "font-bold text-lg text-rose-700";
            }

            feedbackMeaning.innerText = `${correct.word} ➔ ${correct.meaning} (${correct.category})`;
            sentenceEn.innerText = correct.sentenceEn;
            sentenceZh.innerText = correct.sentenceZh;

            feedbackCard.classList.remove('hidden');
            nextBtn.classList.remove('hidden');
        }

        // 下一題或進入結算
        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                renderQuestion();
            } else {
                showResults();
            }
        }

        // 結算頁面展示
        function showResults() {
            progressBar.style.width = "100%";
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const total = currentQuestions.length;
            const correctCount = total - wrongAnswers.length;
            const accuracyPercent = Math.round((correctCount / total) * 100);

            finalScore.innerText = `${accuracyPercent}%`;
            finalAccuracy.innerText = `${correctCount} / ${total}`;

            // 觸發多層次「純藍色系」灑花
            triggerBlueConfetti();

            // 處理錯題檢討清單
            if (wrongAnswers.length > 0) {
                mistakesContainer.classList.remove('hidden');
                mistakesList.innerHTML = '';
                wrongAnswers.forEach(item => {
                    const row = document.createElement('div');
                    row.className = `bg-white border border-sky-100 rounded-xl p-3 flex items-center justify-between text-sm shadow-sm`;
                    row.innerHTML = `
                        <div>
                            <span class="font-bold text-slate-800">${item.word}</span>
                            <span class="text-xs text-sky-500 ml-2 font-medium">Unit ${item.unit}</span>
                            <p class="text-xs text-slate-500 mt-0.5">${item.meaning}</p>
                        </div>
                        <button class="review-speak-btn text-sky-500 hover:text-sky-700 bg-sky-50 hover:bg-sky-100 p-2 rounded-lg transition" title="聽發音">
                            <i class="fa-solid fa-volume-low"></i>
                        </button>
                    `;
                    row.querySelector('.review-speak-btn').addEventListener('click', () => playSpeech(item.word));
                    mistakesList.appendChild(row);
                });
            } else {
                mistakesContainer.classList.add('hidden');
            }
        }

        // 重置測驗
        function resetQuiz() {
            resultScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        }

        // --- 純藍色系 Confetti 灑花效果 (小桃限定調色) ---
        function triggerBlueConfetti() {
            if (typeof confetti !== 'function') return;

            // 純藍色調組合: 極淺雪藍, 天空藍, 寶藍, 皇家純藍, 經典純藍, 靛藍
            const bluePalette = ['#e0f2fe', '#7dd3fc', '#38bdf8', '#0284c7', '#0052cc', '#0033ff', '#0000d1'];

            // 第一波雙側發射
            confetti({
                particleCount: 60,
                spread: 70,
                origin: { y: 0.6, x: 0.2 },
                colors: bluePalette
            });
            confetti({
                particleCount: 60,
                spread: 70,
                origin: { y: 0.6, x: 0.8 },
                colors: bluePalette
            });

            // 第二波中央高空漫天降落
            setTimeout(() => {
                confetti({
                    particleCount: 80,
                    angle: 90,
                    spread: 100,
                    origin: { y: 0.4 },
                    colors: bluePalette,
                    scalar: 1.2
                });
            }, 250);
        }

        // 英文語音朗讀函式 (Web Speech API)
        function playSpeech(text, buttonEl = null) {
            if (!('speechSynthesis' in window)) return;

            synth.cancel(); // 停止先前的發音
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9; // 稍微放慢語速

            if (buttonEl) {
                buttonEl.classList.add('speaking-active');
                utterance.onend = () => buttonEl.classList.remove('speaking-active');
                utterance.onerror = () => buttonEl.classList.remove('speaking-active');
            }

            synth.speak(utterance);
        }

        // 輔助工具: 取得隨機誘答選項
        function getRandomDistractors(correctItem, count) {
            const pool = vocabularyData.filter(item => item.meaning !== correctItem.meaning);
            return shuffleArray(pool).slice(0, count);
        }

        // 輔助工具: 洗牌演算法 (Fisher-Yates)
        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
    </script>
